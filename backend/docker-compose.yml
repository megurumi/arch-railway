services:
  db:
    image: mysql:8
    container_name: local_db
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: local_database
      MYSQL_USER: local_user
      MYSQL_PASSWORD: local_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: