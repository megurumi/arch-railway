services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - .:/app
      - /app/node_modules  # Prevents overwriting node_modules
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: npx ts-node src/app.ts  # Use ts-node for TypeScript
    environment:
      - NODE_ENV=${NODE_ENV}
      - MYSQL_URL=${MYSQL_URL}

  db:
    image: mysql:8
    env_file:
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}  # Fix root password issue
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

volumes:
  db_data: