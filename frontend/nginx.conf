server {
    listen 8080;
    server_name _;

    # Set the root to the directory where your built app resides
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and fallback to index.html for frontend routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle 404 errors and redirect them to index.html
    error_page 404 /index.html;

    # Optional: Add cache control for static assets
    location ~* \.(?:css|js|woff|woff2|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Handle long-lived connections efficiently with gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Optional: Ensure proper response headers for security
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    error_log /var/log/nginx/error.log warn;
}